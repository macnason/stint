name: Feature request
description: Propose a change to the component, schema, or CLI
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Stint makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Design principles
      description: >
        Stint keeps a deliberately small surface. Confirm the proposal fits, or
        explain in the box above why an exception is warranted.
      options:
        - label: The component still owns no container (no background, border, or elevation).
        - label: Data stays month-precision and serializable.
        - label: Integrations stay generic — no concrete haptics, text-morphing, or image primitives in the package.
